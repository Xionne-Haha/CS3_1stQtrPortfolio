<!DOCTYPE html>
<html>
<body>

<h2> Q1 3rd Graded Exercise submitted by Xionne from 9-Sodium</h2>
   
<p>Guess the number: **** (1 to 100)</p>
<input id="guessInput">
<button onclick="checkIt()">Check It</button>

<p id="result">Result:</p>

<script>
let dNumber = Math.floor(Math.random() * 100) + 1;

function checkIt() {
    let n = +document.getElementById("guessInput").value;
    let resultElement = document.getElementById("result");

    if (n > dNumber) {
        resultElement.innerHTML = "Result: Lower!";
    } else if (n < dNumber) {
        resultElement.innerHTML = "Result: Higher!";
    } else if (n === dNumber) {
        resultElement.innerHTML = "Result: Correct!";
    }
}
</script>
         
    </script>

</body>

</html>
